<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Trivia Súper Simple</title>
    <link rel="icon" type="image/png" href="../../../assets/img/logos_meta/logo_p.png">
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f0f4f8;
        margin: 0;
        padding: 20px;
    }
    .pantalla {
        max-width: 500px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .oculto { display: none; }
    button {
        padding: 12px 24px;
        font-size: 18px;
        margin: 10px;
        cursor: pointer;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 6px;
    }
    button:hover { background: #45a049; }
    .opcion {
        display: block;
        padding: 12px;
        margin: 10px auto;
        width: 80%;
        background: #e3f2fd;
        border: 2px solid #90caf9;
        border-radius: 6px;
        cursor: pointer;
    }
    .opcion:hover { background: #bbdefb; }
    #tiempo {
        font-size: 28px;
        font-weight: bold;
        color: #d32f2f;
        margin: 15px 0;
    }
    #resumen { text-align: left; }
    </style>
</head>
<body>
<div id="inicio" class="pantalla">
    <h1>¡Trivia Fácil!</h1>
    <p>Escribe tu nombre:</p>
    <input type="text" id="nombre" placeholder="Tu nombre aquí" style="padding:12px; font-size:18px; width:80%;">
    <br>
    <button onclick="empezarJuego()">¡Jugar!</button>
</div>

<div id="juego" class="pantalla oculto">
    <h2 id="preguntaTexto"></h2>
    <div id="opciones"></div>
    <div>Puntos: <span id="puntos">0</span></div>
    <div>Tiempo restante: <span id="tiempo">10</span> segundos</div>
</div>

<div id="resultados" class="pantalla oculto">
    <h1>¡Terminaste, <span id="nombreFinal"></span>!</h1>
    <h2>Puntaje final: <span id="puntajeFinal">0</span>/100</h2>
    <div id="resumen"></div>
    <button onclick="location.reload()">Jugar de nuevo</button>
</div>

<script>
    const preguntas = [
    {
        pregunta: "¿Cuál es la capital de México?",
        opciones: ["Ciudad de México", "Guadalajara", "Monterrey", "Puebla"],
        correcta: 0
    },
    {
        pregunta: "¿Cuántos lados tiene un triángulo?",
        opciones: ["3", "4", "5", "6"],
        correcta: 0
    },
    {
        pregunta: "¿Qué color es el cielo en un día soleado?",
        opciones: ["Rojo", "Azul", "Verde", "Amarillo"],
        correcta: 1
    },
    {
        pregunta: "2 + 2 = ?",
        opciones: ["3", "4", "5", "22"],
        correcta: 1
    },
    ];
let indicePregunta = 0;
let puntos = 0;
let nombreJugador = "";
let respuestasUsuario = [];
let temporizador;

// dowhile obligar a escribir un nombre
function empezarJuego() {
    do {
    nombreJugador = document.getElementById("nombre").value.trim();
    if (nombreJugador == "") {
        alert("¡Escribe tu nombre para jugar!");
    }
    } while (nombreJugador == "");
    document.getElementById("inicio").classList.add("oculto");
    document.getElementById("juego").classList.remove("oculto");
    mostrarPregunta();
}

//  for  recorrer  mostrar  preguntas
function mostrarPregunta() {
    if (indicePregunta >= preguntas.length) {
        terminarJuego();
        return;
    }
    const preg = preguntas[indicePregunta];
    document.getElementById("preguntaTexto").textContent = preg.pregunta;
    document.getElementById("puntos").textContent = puntos;
    const contenedor = document.getElementById("opciones");
    contenedor.innerHTML = "";
    preg.opciones.forEach((opcion, indice) => {  
        const btn = document.createElement("div");
        btn.className = "opcion";
        btn.textContent = `${String.fromCharCode(65 + indice)}) ${opcion}`; 
        btn.onclick = () => responder(indice); 
        contenedor.appendChild(btn);
    });
    iniciarTemporizador();
}

//  cuenta regresiva 
function iniciarTemporizador() {
    let tiempo = 10;
    document.getElementById("tiempo").textContent = tiempo;
    temporizador = setInterval(() => {
        tiempo--;
        ocument.getElementById("tiempo").textContent = tiempo;
        if (tiempo <= 0) {
            clearInterval(temporizador);
            respuestasUsuario.push({ correcta: false, tiempoAgotado: true });
            indicePregunta++;
            mostrarPregunta();
        }
    }, 1000);
}

function responder(indiceElegido) {
    clearInterval(temporizador);
    const preg = preguntas[indicePregunta];
    const esCorrecta = indiceElegido === preg.correcta;
    if (esCorrecta) {
        puntos += 20;
    }
    respuestasUsuario.push({ correcta: esCorrecta, tiempoAgotado: false });
    indicePregunta++;
    mostrarPregunta();
}

function terminarJuego() {
    document.getElementById("juego").classList.add("oculto");
    document.getElementById("resultados").classList.remove("oculto");
    document.getElementById("nombreFinal").textContent = nombreJugador;
    document.getElementById("puntajeFinal").textContent = puntos;
    const resumen = document.getElementById("resumen");
    resumen.innerHTML = "<h3>Resumen:</h3>";
    for (let i = 0; i < preguntas.length; i++) {
        const preg = preguntas[i];
        const resp = respuestasUsuario[i];
        let texto = `<p><strong>${i+1}. ${preg.pregunta}</strong><br>`;
        if (resp.tiempoAgotado) {
            texto += "Tiempo agotado";
        } else if (resp.correcta) {
            texto += "Correcto";
        } else {
            texto += "Incorrecto";
        }
        texto += "</p>";
        resumen.innerHTML += texto;
    }
    }
</script>

</body>
</html>
