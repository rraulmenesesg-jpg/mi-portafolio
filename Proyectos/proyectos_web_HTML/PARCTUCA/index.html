<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafío de Preguntas</title>
  <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="../../../assets/img/logos_meta/logo_p.png">
</head>
<body>

  <div class="contenedor">
    
    <header>
      <h1>Desafío de Preguntas</h1>
      <p>Tienes <strong>60 segundos</strong> para responder las 5 preguntas. ¡Suerte!</p>
    </header>

    <div id="preguntas">
      <div class="pregunta">
        <label for="q1">1. ¿Cuál es la capital de Francia?</label>
        <input type="text" id="q1">
      </div>
      
      <div class="pregunta">
        <label for="q2">2. ¿Cuántos planetas hay en el sistema solar?</label>
        <input type="text" id="q2">
      </div>
      
      <div class="pregunta">
        <label for="q3">3. ¿Qué elemento químico tiene el símbolo "O"?</label>
        <input type="text" id="q3">
      </div>
      
      <div class="pregunta">
        <label for="q4">4. ¿En qué año llegó el hombre a la Luna?</label>
        <input type="text" id="q4">
      </div>
      
      <div class="pregunta">
        <label for="q5">5. ¿Cuál es el río más largo del mundo?</label>
        <input type="text" id="q5">
      </div>
    </div>

    <div class="controles">
      <button id="btn-verificar">Verificar</button>
      <button id="btn-reiniciar">Reiniciar</button>
    </div>

    <div id="estado">
      <div id="tiempo">Tiempo restante: <span id="contador">60</span> s</div>
      <div id="resultado"></div>
    </div>

  </div>

  <script src="scripts.js"></script>
</body>
</html>
