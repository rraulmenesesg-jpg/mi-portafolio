<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Física</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/png" href="../../../assets/img/logos_meta/logo_p.png">
    <script src="cacular.js"></script>
</head>
<body>
    <div class="contenedor">
        <header>
            <h1>Calculadora Física</h1>
        </header>

        <div class="seccion">
            <h2>1. Masa de un objeto</h2>
            <p><strong>Fórmula:</strong> <span class="formula">m = w / g</span></p>
            <p>Donde <strong>g = 9.81 m/s²</strong></p>
            
            <input type="number" id="peso" placeholder="Peso (Newtons) ejemplo: 98.1">
            <button onclick="calcularMasa()">Calcular Masa</button>
            <div class="resultado" id="resultadoMasa">Resultado aparecerá aquí</div>
        </div>

        <div class="seccion">
            <h2>2. Velocidad</h2>
            <p><strong>Fórmula:</strong> <span class="formula">v = distancia / tiempo</span></p>
            
            <input type="number" id="distancia" placeholder="Distancia (metros)">
            <input type="number" id="tiempo" placeholder="Tiempo (segundos)">
            <button onclick="calcularVelocidad()">Calcular Velocidad</button>
            <div class="resultado" id="resultadoVelocidad">Resultado aparecerá aquí</div>
        </div>

        <div class="seccion">
            <h2>3. Área de un cuadrado</h2>
            <p><strong>Fórmula:</strong> <span class="formula">Área = lado × lado</span></p>
            
            <input type="number" id="lado" placeholder="Lado (metros)">
            <button onclick="calcularArea()">Calcular Área</button>
            <div class="resultado" id="resultadoArea">Resultado aparecerá aquí</div>
        </div>
    </div>
</body>
</html>
