<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ahorros Inteligente</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/png" href="../../../assets/img/logos_meta/logo_p.png">
    <script src="ssiemahaoro.js"></script>
</head>
<body>

    <h1>Haorros Inteligente</h1>

    <div class="form-container">
        <label for="meta">Meta de ahorro (en MXN):</label>
        <input type="number" id="meta" min="1" step="1" placeholder="Ej: 50000">

        <label for="ahorroMensual">Cuánto puedes ahorrar por mes (MXN):</label>
        <input type="number" id="ahorroMensual" min="1" step="1" placeholder="Ej: 3000">

        <button onclick="calcularAhorro()">Calcular plan de ahorro</button>
    </div>

    <div id="resultado"></div>
</body>
</html>
