<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Retos JavaScript</title>
    <link rel="icon" type="image/png" href="../../../assets/img/logos_meta/logo_p.png">
</head>
<body>

    <div class="contenedor">

        <h1>Retos JavaScript</h1>

        <div class="reto1">
            <h2 class="titulo-reto">imprimir del 1 - 50 y multiplos </h2>
            <button onclick="reto()">Ejecutar Reto 1</button>
            <input type="number" name="" id="limite">
            <pre id="salida1">Presiona el botón...</pre>
            <h3 id="final"></h3>
        </div>

    </div>
<script>
    function reto() {
    let suma = 0;
    let limite = document.getElementById("limite").value;
    for(let i = 1; i <= limite ; i++) {
        suma = suma + i;
    }
    document.getElementById("salida1").textContent = suma;
}
</script>
</body>
</html>
