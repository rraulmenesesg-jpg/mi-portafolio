<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> </title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/png" href="../../../assets/img/logos_meta/logo_p.png">
</head>
<body>

    <div class="header">
        TIENDA - CARRITO DE COMPRAS
    </div>

    <div class="main-container">
        <div class="productos-grid" id="productosGrid"></div>

        <div class="cart-sidebar">
        <div class="cart-header">Tu Carrito de Compras</div>
        <div id="cartItems"></div>

        <div class="totales" id="cartTotales">
            <div class="total-line"><span>Subtotal:</span><span id="subtotal">$0</span></div>
            <div class="total-line descuento" id="descuentoLine" style="display:none;">Descuento 10%:</div>
            <div class="total-line"><strong>Total a pagar:</strong><span class="total-final" id="totalFinal">$0</span></div>
        </div>

        <button onclick="vaciarCarrito()" style="width:100%; margin-top:20px; padding:14px; background:#e74c3c; color:white; border:none; border-radius:8px; cursor:pointer; font-size:1.05rem;">
            Vaciar Carrito
        </button>
        </div>
    </div>

    <!-- Mensaje flotante -->
    <div id="toast" class="toast">Producto agregado</div>

    <script src="sistema_vemntas.js"></script>
</body>
</html>
