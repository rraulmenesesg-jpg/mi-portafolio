<!DOCTYPE html>
<html lang="es-mx">
<head>
  
  <meta name="description" content="Portafolio | Raúl Meneses dev caluladora basica echa solante con js y html basico" />

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>>Portafolio | Raúl Meneses | Calculadora Básica</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/styles_calculadora.css">

  <link rel="icon" type="image/png" href="../assets/img/logos_meta/logo_cal.ico">

</head>

<body>
  <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <img src="../assets/img/logos_meta/logo_p.ico" alt="logo" class="ico-imagen">
        Raúl Meneses
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">

          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>

        </ul>
      </div>
    </div>
  </nav>

  <main>
    <div class="calculadora">

      <div class="p-3 bg-primary text-white d-flex justify-content-between">
        <span>Calculadora</span>
        <span>Básica</span>
      </div>

      <div class="historial" id="historial">0</div>

      <input type="text" class="pantalla" id="pantalla" value="0">

      <div class="teclado">
        <button class="btn btn-funcion">C</button>
        <button class="btn btn-funcion">(</button>
        <button class="btn btn-funcion">)</button>

        <button class="btn btn-funcion">mod</button>
        <button class="btn btn-funcion">n</button>

        <button class="btn btn-light" onclick="escribe7()">7</button>
        <button class="btn btn-light" onclick="escribe8()">8</button>
        <button class="btn btn-light" onclick="escribe9()">9</button>

        <button class="btn btn-operador">/</button>
        <button class="btn btn-funcion">√</button>

        <button class="btn btn-light" onclick="escribe4()">4</button>
        <button class="btn btn-light" onclick="escribe5()">5</button>
        <button class="btn btn-light" onclick="escribe6()">6</button>

        <button class="btn btn-operador">×</button>
        <button class="btn btn-funcion">^</button>

        <button class="btn btn-light" onclick="escribe1()">1</button>
        <button class="btn btn-light" onclick="escribe2()">2</button>
        <button class="btn btn-light" onclick="escribe3()">3</button>

        <button class="btn btn-operador">-</button>
        <button class="btn btn-igual">=</button>

        <button class="btn btn-light" onclick="escribe0()">0</button>

        <button class="btn btn-light">.</button>
        <button class="btn btn-light">%</button>
        <button class="btn btn-operador">+</button>
      </div>
    </div>
  </main>

  <script src="../assets/js/script_calculadora.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</body>
</html>
