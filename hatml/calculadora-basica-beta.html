<!DOCTYPE html>
<html lang="es-mx">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora Básica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles_calculadora.css">
  <link rel="icon" type="image/png" href="../assets/img/logos_meta/logo_cal.png">
</head>
<body>

  <div class="calculadora">

    <div class="p-3 bg-primary text-white d-flex justify-content-between">
      <span>Calculadora</span>
      <span>Básica</span>
    </div>

    <div class="historial" id="historial">0</div>

    <input type="text" class="pantalla" id="pantalla" value="0">

    <div class="teclado">
      <button class="btn btn-funcion">C</button>
      <button class="btn btn-funcion">(</button>
      <button class="btn btn-funcion">)</button>

      <button class="btn btn-funcion">mod</button>
      <button class="btn btn-funcion">n</button>

      <button class="btn btn-light" onclick="escribe7()">7</button>
      <button class="btn btn-light" onclick="escribe8()">8</button>
      <button class="btn btn-light" onclick="escribe9()">9</button>

      <button class="btn btn-operador">/</button>
      <button class="btn btn-funcion">√</button>

      <button class="btn btn-light" onclick="escribe4()">4</button>
      <button class="btn btn-light" onclick="escribe5()">5</button>
      <button class="btn btn-light" onclick="escribe6()">6</button>

      <button class="btn btn-operador">×</button>
      <button class="btn btn-funcion">^</button>

      <button class="btn btn-light" onclick="escribe1()">1</button>
      <button class="btn btn-light" onclick="escribe2()">2</button>
      <button class="btn btn-light" onclick="escribe3()">3</button>

      <button class="btn btn-operador">-</button>
      <button class="btn btn-igual">=</button>

      <button class="btn btn-light" onclick="escribe0()">0</button>

      <button class="btn btn-light">.</button>
      <button class="btn btn-light">%</button>
      <button class="btn btn-operador">+</button>
    </div>
  </div>

</body>
<script src="../assets/js/script_calculadora.js"></script>

</html>
